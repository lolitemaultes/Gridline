<!-- Gridline original (GPL-3.0), drawn on the 24-unit grid: two stacked toggle switches (inspector pane toggle). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="4" width="18" height="6" rx="3" />
  <circle cx="6.2" cy="7" r="1.4" fill="currentColor" stroke="none" />
  <rect x="3" y="14" width="18" height="6" rx="3" />
  <circle cx="17.8" cy="17" r="1.4" fill="currentColor" stroke="none" />
</svg>
