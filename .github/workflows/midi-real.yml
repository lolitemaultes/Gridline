name: MIDI real devices

# Manual only. MIDI through the real system back ends, with devices plugged in and out while the
# app runs: the ALSA sequencer and its /dev/snd watcher on Linux (a kernel virtual MIDI device,
# snd-virmidi, loaded and unloaded; a user-space sequencer port), and sndio's MIDI thru box on
# OpenBSD and FreeBSD. The regular CI uses stand-in devices instead. The test loads kernel modules
# and restarts sndiod, so it is registered only with GRIDLINE_MIDI_REAL=1 (tools/ci/midi-real.sh,
# tools/ci/midi-real.py). On a runner whose kernel has no sound modules the Linux test runs in a
# virtual machine with Ubuntu's generic kernel (tools/ci/midi-real-vm.sh); when even that cannot run,
# the job says so in its summary and ends with a warning. Each job's summary page lists what ran,
# what passed and what was skipped.
on:
  workflow_dispatch:
    inputs:
      require_kernel:
        description: "Linux: fail when the kernel virtual MIDI module cannot be loaded, here or in the virtual machine (otherwise a warning, and what could run runs alone)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: midi-real-${{ github.ref }}
  cancel-in-progress: true

env:
  GRIDLINE_NO_PLUGIN_SCAN: "1"

jobs:
  linux:
    name: Linux ALSA
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo sh tools/ci/install-deps.sh apt
          sudo apt-get install -y -q --no-install-recommends alsa-utils kmod
          # Some runner kernels keep their sound modules in an extra package.
          sudo apt-get install -y -q --no-install-recommends "linux-modules-extra-$(uname -r)" || echo "linux-modules-extra-$(uname -r) is not a package"
      # GitHub's azure kernel is built without sound: no package has snd-seq or snd-virmidi for it. The
      # test then runs in a virtual machine with Ubuntu's generic kernel (tools/ci/midi-real-vm.sh).
      - name: Sound modules on this runner
        id: kernel
        run: |
          uname -a
          where=runner
          for m in snd-seq snd-virmidi; do
            if modinfo "$m" > /dev/null 2>&1; then echo "$m: $(modinfo -F filename "$m")"; else echo "$m: not in this kernel ($(uname -r))"; where=vm; fi
          done
          cfg="/boot/config-$(uname -r)"
          if [ -f "$cfg" ]; then grep -E '^(# )?CONFIG_(SOUND|SND|SND_SEQUENCER|SND_VIRMIDI)[ =]' "$cfg" || echo "$cfg sets no sound options: the kernel is built without sound"; fi
          echo "where=$where" >> "$GITHUB_OUTPUT"
      - name: MIDI through ALSA, devices plugged in and out (this runner's kernel)
        if: steps.kernel.outputs.where == 'runner'
        env:
          GRIDLINE_MIDI_REAL_ARGS: ${{ inputs.require_kernel && '--require-kernel' || '' }}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" sh tools/ci/midi-real.sh
      - name: MIDI through ALSA, devices plugged in and out (virtual machine, generic kernel)
        if: steps.kernel.outputs.where == 'vm'
        env:
          GRIDLINE_MIDI_REAL_ARGS: ${{ inputs.require_kernel && '--require-kernel' || '' }}
          REQUIRE_KERNEL: ${{ inputs.require_kernel && 'true' || 'false' }}
        run: |
          rc=0
          sh tools/ci/midi-real-vm.sh || rc=$?
          if [ "$rc" = 3 ]; then
            # Nothing could be tested here: said in the summary and as a warning, and the job ends
            # neutral unless the kernel test was required.
            echo "::warning title=Real ALSA MIDI NOT tested::$(sed -n 's/^NOT TESTED: //p' midi-real-out/summary.md)"
            [ "$REQUIRE_KERNEL" = true ] && exit 1
            exit 0
          fi
          exit "$rc"
      - name: Summary
        if: always()
        run: cat midi-real-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midi-real-linux
          path: midi-real-out
          retention-days: 7

  bsd:
    name: ${{ matrix.name }} sndio
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # sndio is part of OpenBSD's base system: it must work there.
          - { name: OpenBSD 7, os: openbsd, args: "--require-sndiod" }
          # FreeBSD's sndio package: reported as skipped when sndiod cannot run in the VM.
          - { name: FreeBSD 14, os: freebsd, args: "" }
    steps:
      - uses: actions/checkout@v4
      - name: OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.7"
          usesh: true
          copyback: true  # midi-real-out only: the script removes its build folder
          mem: 8192
          prepare: sh tools/ci/install-deps.sh openbsd
          run: GRIDLINE_MIDI_REAL_SOFT=1 GRIDLINE_MIDI_REAL_ARGS="${{ matrix.args }}" sh tools/ci/midi-real.sh
      - name: FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          copyback: true  # midi-real-out only: the script removes its build folder
          mem: 8192
          prepare: sh tools/ci/install-deps.sh freebsd
          run: GRIDLINE_MIDI_REAL_SOFT=1 GRIDLINE_MIDI_REAL_ARGS="${{ matrix.args }}" sh tools/ci/midi-real.sh
      - name: Summary and result
        if: always()
        run: |
          cat midi-real-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary was copied back from the VM." >> "$GITHUB_STEP_SUMMARY"
          cat midi-real-out/summary.md 2>/dev/null || true
          test "$(cat midi-real-out/status 2>/dev/null || echo missing)" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midi-real-${{ matrix.os }}
          path: midi-real-out
          retention-days: 7
