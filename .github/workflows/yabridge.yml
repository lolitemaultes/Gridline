name: yabridge

# Windows plugins bridged with yabridge in Gridline, through real X11 input on real mapped windows:
# tests/yabridge/harness.py. Results: a table in the job summary, screenshots, logs and X dumps as
# artifacts. Failures are not retried. Started by hand, or by a change to these files; never on a
# schedule. "reduced" runs one Wine on one display, for working on the test itself.
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "reduced or full"
        default: reduced
        required: true
      repeats:
        description: "times to run each job, to expose instability"
        default: "1"
        required: true
  push:
    branches: [main]
    paths:
      - "tests/yabridge/**"
      - ".github/workflows/yabridge.yml"

permissions:
  contents: read

concurrency:
  group: yabridge-${{ github.ref }}
  cancel-in-progress: true

env:
  YABRIDGE_VERSION: "5.1.1"
  YABRIDGE_SHA256: d11f0307412b5566b09a75ed4aa191266db56d22f4de4d20e4fbde6296cd1a47
  DEXED_SHA256: 4773150a3dfa281d1caef583f493a41ed99ea95b054b5a3479780799ed6279cc
  SURGE_SHA256: 564e162c560af07ad4ed47fe1bfcd827cf97a575de30d06c48249aad2e7c35e6

jobs:
  build:
    name: Build Gridline and the probes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Binaries from an earlier run of the same source
        id: cache
        uses: actions/cache@v4
        with:
          path: out-bin
          key: yabridge-bin-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**', 'third_party/**', 'assets/fonts/**') }}
      - name: Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo sh tools/ci/install-deps.sh apt
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRIDLINE_GUI_TESTS=OFF
          cmake --build build -j4 --target gridline gridline-app
          mkdir -p out-bin
          cp build/gridline build/gridline-app out-bin/
      - name: Probe plugins (Windows, cross-compiled)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix > /dev/null
          bash tests/yabridge/build_probe.sh . out-probe
      - name: Plan the jobs
        id: plan
        env:
          MATRIX: ${{ github.event.inputs.matrix || 'reduced' }}
          REPEATS: ${{ github.event.inputs.repeats || '1' }}
        run: python3 tests/yabridge/plan.py "$MATRIX" "$REPEATS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            out-bin
            out-probe
          retention-days: 7

  test:
    name: ${{ matrix.wine }} ${{ matrix.display }} x${{ matrix.scale }} run ${{ matrix.run }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Wine and the test tools
        run: |
          bash tests/yabridge/install_wine.sh "${{ matrix.wine_install }}"
          sudo sh tools/ci/install-deps.sh apt
          chmod +x out-bin/*
      - name: yabridge (official release, checked)
        run: |
          curl -fsSL -o yabridge.tar.gz "https://github.com/robbert-vdh/yabridge/releases/download/${YABRIDGE_VERSION}/yabridge-${YABRIDGE_VERSION}.tar.gz"
          echo "${YABRIDGE_SHA256}  yabridge.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/share"
          tar -xzf yabridge.tar.gz -C "$HOME/.local/share"
      - name: Real plugins (official releases, checked)
        if: matrix.real != ''
        run: |
          mkdir -p dl
          curl -fsSL -o dl/Dexed-1.1.0-win.zip https://github.com/asb2m10/dexed/releases/download/v1.1.0/Dexed-1.1.0-win.zip
          curl -fsSL -o dl/surge-xt-win64-1.3.4-pluginsonly.zip https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-win64-1.3.4-pluginsonly.zip
          curl -fsSL -o dl/DPF-Plugins-v1.7-win64.zip https://github.com/DISTRHO/DPF-Plugins/releases/download/v1.7/DPF-Plugins-v1.7-win64.zip
          echo "${DEXED_SHA256}  dl/Dexed-1.1.0-win.zip" | sha256sum -c -
          echo "${SURGE_SHA256}  dl/surge-xt-win64-1.3.4-pluginsonly.zip" | sha256sum -c -
          sha256sum dl/DPF-Plugins-v1.7-win64.zip
      - name: Test
        run: |
          args=(--formats "${{ matrix.formats }}" --modes "${{ matrix.modes }}")
          [ -n "${{ matrix.real }}" ] && args+=(--real "${{ matrix.real }}")
          [ "${{ matrix.control }}" = "1" ] && args+=(--control)
          bash tests/yabridge/run_job.sh out-bin/gridline-app out-bin/gridline out-probe dl results "${{ matrix.wine }}" "${{ matrix.display }}" "${{ matrix.scale }}" "${{ matrix.run }}" "${args[@]}"
      - name: This job's table
        if: always()
        run: python3 tests/yabridge/summarize.py results --summary "$GITHUB_STEP_SUMMARY" || true
      - name: Keep only what is useful
        if: always()
        run: rm -rf results/work results/xdg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.wine }}-${{ matrix.display }}-x${{ matrix.scale }}-run${{ matrix.run }}
          path: results
          retention-days: 7

  summary:
    name: All results
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all
      - name: The table
        run: python3 tests/yabridge/summarize.py all --summary "$GITHUB_STEP_SUMMARY" --json results-table.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-table
          path: results-table.json
          retention-days: 7
