name: Packaging

# K-1: the files for each distribution channel (packaging/) are checked here.
#   - every push and pull request that touches them: templates render, manifests parse and match
#     their published schemas, the AppStream metadata and desktop entry validate;
#   - the same, plus real builds (Flatpak with flatpak-builder and Flathub's linter, the AUR source
#     package with makepkg and namcap, the COPR spec with rpmbuild, the FreeBSD port, the snap), on
#     every push to main that touches these files, on "Run workflow", on a version tag and every
#     Monday, so a change to the packaging is built before a release tag builds it. The same runs
#     build and check the Gridline Suite and Suite Mini plugin downloads (installers and
#     all-plugins zips) the way release.yml does.
# Nothing is published or submitted: the release workflow writes the filled-in files for a release
# as the workflow artifact "packaging-<version>" and the user submits them.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - "assets/linux/**"
      - "tools/release/**"
      - "tools/windows/gridline.iss"
      - "CMakeLists.txt"
      - ".github/workflows/packaging.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "assets/linux/**"
      - "tools/release/**"
      - "tools/windows/gridline.iss"
      - "CMakeLists.txt"
      - ".github/workflows/packaging.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      builds:
        description: "Also build the packages (Flatpak, AUR, COPR, FreeBSD port, snap)"
        type: boolean
        default: true

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  GRIDLINE_NO_PLUGIN_SCAN: "1"
  GRIDLINE_NO_UPDATE_CHECK: "1"

jobs:
  lint:
    name: Manifests, metadata, schemas
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.b.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - id: b
        name: Real builds in this run?
        run: |
          b=false
          case "${{ github.event_name }}" in
            schedule) b=true ;;
            workflow_dispatch) b="${{ inputs.builds }}" ;;
            push) b=true ;;  # (main, only when the paths above change, and version tags)
          esac
          echo "builds=$b" >> "$GITHUB_OUTPUT"
      - name: Tools
        run: |
          # (a few tries a little apart: the package mirrors are now and then unreachable from a runner for a while)
          for n in 1 2 3 4; do
            sudo apt-get update -q -o Acquire::Retries=3 || true
            sudo apt-get install -y -q -o Acquire::Retries=3 desktop-file-utils libxml2-utils && break
            [ "$n" = 4 ] && exit 1
            echo "apt failed; trying again in $((n * 30)) s"; sleep $((n * 30))
          done
          python3 -m pip install --quiet --user pyyaml jsonschema
      - name: Schemas
        run: |
          mkdir -p schemas
          curl -fsSL -o schemas/flatpak-manifest.schema.json https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json
          curl -fsSL -o schemas/snapcraft.json https://raw.githubusercontent.com/canonical/snapcraft/main/schema/snapcraft.json
          curl -fsSL -o schemas/scoop.schema.json https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json
          w=https://raw.githubusercontent.com/microsoft/winget-cli/master/schemas/JSON/manifests/v1.10.0
          curl -fsSL -o schemas/winget.version.json "$w/manifest.version.1.10.0.json"
          curl -fsSL -o schemas/winget.installer.json "$w/manifest.installer.1.10.0.json"
          curl -fsSL -o schemas/winget.defaultLocale.json "$w/manifest.defaultLocale.1.10.0.json"
      - name: Render and check every channel's files
        run: |
          python3 packaging/render.py --out rendered --fake-sums
          python3 packaging/check.py --schemas schemas --rendered rendered
      - name: Desktop entry and file type
        run: |
          desktop-file-validate assets/linux/gridline.desktop
          xmllint --noout assets/linux/gridline.xml packaging/chocolatey/gridline.nuspec.in
      - name: AppStream metadata (appstreamcli; errors fail)
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:latest sh -c \
            'dnf install -y -q appstream > /dev/null && appstreamcli validate --no-net --explain assets/linux/com.lolitemaultes.Gridline.metainfo.xml'
      - name: AppStream metadata, strict (warnings and pedantic hints, for Flathub's review)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:latest sh -c \
            'dnf install -y -q appstream > /dev/null && appstreamcli validate --strict --pedantic --no-net --explain assets/linux/com.lolitemaultes.Gridline.metainfo.xml'

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      MANIFEST: packaging/flatpak/com.lolitemaultes.Gridline.yml
      APP: com.lolitemaultes.Gridline
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak installations in the container's own layer
        # K-326: on some runner images the build step's runtime update failed with "Invalid
        # cross-device link" for every runtime and flatpak-builder then crashed (xvfb-run exit 139).
        # Updating a runtime moves its old deployment aside (a directory rename); the image's
        # runtimes sit in a lower overlay layer, where that rename gives EXDEV unless the storage
        # driver redirects directories. Copied into the container's own layer, the rename works.
        run: |
          for d in /var/lib/flatpak "$HOME/.local/share/flatpak"; do
            if [ ! -d "$d" ] || [ "$(stat -f -c %T "$d")" != overlayfs ]; then continue; fi
            echo "copying $d ($(du -sh "$d" | cut -f1)) into the container layer"
            cp -a "$d" "$d.k326" && rm -rf "$d" && mv "$d.k326" "$d"
          done
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: Gridline-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/**') }}
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: true
          artifact-name: gridline-flatpak-${{ matrix.arch }}
      - name: The programs run inside the sandbox
        # rofiles-fuse cannot mount in the container, so the build step above passes
        # --disable-rofiles-fuse. flatpak-builder --run does not take that option (it always tries
        # rofiles-fuse) and does without it only when rofiles-fuse is not on PATH: move it aside.
        run: |
          rf="$(command -v rofiles-fuse || true)"
          if [ -n "$rf" ]; then mv "$rf" "$rf.off"; fi
          if command -v rofiles-fuse > /dev/null; then echo "rofiles-fuse is still on PATH"; exit 1; fi
          fb_run() { flatpak-builder --run flatpak_app "$MANIFEST" "$@"; }
          eval "$(bash tools/release/version.sh)"
          out="$(fb_run gridline --version)"
          echo "$out"; test "$out" = "Gridline $full"
          fb_run /app/share/gridline/tools/ffmpeg -hide_banner -version | head -1
          fb_run /app/share/gridline/tools/yt-dlp --version
          test "$(cat flatpak_app/files/share/gridline/tools/yt-dlp.version)" = "$(fb_run /app/share/gridline/tools/yt-dlp --version)"
          fb_run gridline suite status || true
      - name: Exported desktop entry, icons, file type and metadata
        run: |
          e=flatpak_app/export/share
          command -v desktop-file-validate > /dev/null || dnf install -y -q desktop-file-utils
          desktop-file-validate "$e/applications/$APP.desktop"
          grep -x "Icon=$APP" "$e/applications/$APP.desktop"
          grep -x "StartupWMClass=$APP" "$e/applications/$APP.desktop"
          test -f "$e/icons/hicolor/scalable/apps/$APP.svg"
          test -f "$e/icons/hicolor/256x256/apps/$APP.png"
          test -f "$e/mime/packages/$APP.xml"
          grep -q "<launchable type=\"desktop-id\">$APP.desktop</launchable>" "flatpak_app/files/share/metainfo/$APP.metainfo.xml"
          if find flatpak_app/files/lib -name "*.vst3" -o -name "*.clap" | grep -q .; then echo "plugins in the Flatpak"; exit 1; fi
      - name: Flathub's linter (the Flathub manifest and the built repository)
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          command -v python3 > /dev/null || dnf install -y -q python3
          python3 packaging/render.py --out rendered --fake-sums --commit "$GITHUB_SHA"
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "rendered/flathub/$APP.yml"
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

  aur:
    name: AUR (Arch Linux)
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap python
      - uses: actions/checkout@v4
      - name: Source archive and the filled-in PKGBUILDs
        run: |
          git config --global --add safe.directory "$PWD"
          eval "$(bash tools/release/version.sh)"
          mkdir -p dist
          git archive --format=tar.gz --prefix="Gridline-$full/" -o "dist/Gridline-$full-source.tar.gz" HEAD
          python3 packaging/render.py --out rendered --fake-sums --dist dist
          useradd -m builder
          cp "dist/Gridline-$full-source.tar.gz" rendered/aur/gridline/
          chown -R builder rendered
      - name: .SRCINFO matches makepkg --printsrcinfo
        run: |
          for p in gridline gridline-bin; do
            (cd "rendered/aur/$p" && su builder -c "makepkg --printsrcinfo" > .SRCINFO.makepkg)
            diff <(sort "rendered/aur/$p/.SRCINFO") <(sort "rendered/aur/$p/.SRCINFO.makepkg")
          done
      - name: namcap (PKGBUILDs)
        run: namcap rendered/aur/gridline/PKGBUILD rendered/aur/gridline-bin/PKGBUILD
      - name: Build the source package
        run: |
          pacman -S --noconfirm --needed alsa-lib curl hicolor-icon-theme jack2 libgl libx11 sdl2 cmake ninja
          cd rendered/aur/gridline && su builder -c "makepkg --noconfirm --nodeps"
      - name: namcap (package) and the installed program
        run: |
          pkg="$(ls rendered/aur/gridline/gridline-*.pkg.tar.zst | grep -v debug | head -1)"
          namcap "$pkg"
          pacman -U --noconfirm "$pkg"
          eval "$(bash tools/release/version.sh)"
          test "$(gridline --version)" = "Gridline $full"
          bash tools/ci/check-linux-icons.sh /usr
      # Arch's SDL2 is sdl2-compat over SDL3, which can choose Wayland by itself.
      - name: Plugin interfaces on a Wayland desktop (sdl2-compat)
        run: |
          pacman -S --noconfirm --needed weston xorg-xwayland mesa
          pacman -Q sdl2 sdl2-compat sdl3 weston || true
          mkdir -p wl-work && chown builder wl-work
          su builder -c "python3 tools/ci/check-wayland.py /usr/bin/gridline-app /usr/bin/gridline /usr/lib/vst3 wl-work"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aur-wayland-logs
          path: |
            wl-work/*/app.log
            wl-work/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: aur-srcinfo
          path: rendered/aur/*/.SRCINFO.makepkg

  copr:
    name: COPR spec (Fedora)
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: ubuntu-latest
    # the rpm build alone takes 60-85 minutes and packing the 4 GB of files another 25-30
    timeout-minutes: 180
    container: fedora:latest
    steps:
      - name: Tools
        run: dnf install -y -q rpm-build rpmlint git python3
      - uses: actions/checkout@v4
      - name: Build the rpm from the source archive
        run: |
          git config --global --add safe.directory "$PWD"
          eval "$(bash tools/release/version.sh)"
          mkdir -p ~/rpmbuild/SOURCES dist
          git archive --format=tar.gz --prefix="Gridline-$full/" -o "dist/Gridline-$full-source.tar.gz" HEAD
          cp "dist/Gridline-$full-source.tar.gz" ~/rpmbuild/SOURCES/
          python3 packaging/render.py --out rendered --fake-sums --dist dist
          rpmlint rendered/copr/gridline.spec || true
          rpmspec -q --buildrequires rendered/copr/gridline.spec | xargs -d '\n' dnf install -y -q
          rpmbuild -ba rendered/copr/gridline.spec
          rpm -qpl ~/rpmbuild/RPMS/*/gridline-*.rpm | grep -q /usr/bin/gridline-app
          dnf install -y -q ~/rpmbuild/RPMS/*/gridline-[0-9]*.rpm
          test "$(gridline --version)" = "Gridline $full"

  freebsd:
    name: FreeBSD port
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Source archive and the filled-in port
        run: |
          eval "$(bash tools/release/version.sh)"
          mkdir -p dist
          git archive --format=tar.gz --prefix="Gridline-$full/" -o "dist/Gridline-$full-source.tar.gz" HEAD
          python3 packaging/render.py --out rendered --fake-sums --dist dist
      - uses: vmactions/freebsd-vm@v1
        with:
          # "14": the newest 14.x release, which the ports tree supports (it stops building on a
          # point release once that release has reached its end of life).
          release: "14"
          usesh: true
          mem: 8192
          prepare: pkg install -y git portlint bash
          run: |
            set -e
            freebsd-version
            # The ports tree from the branch the VM's packages are built from: the current
            # quarterly branch (YYYYQn) for the quarterly package set, main for the latest one.
            if pkg -vv | grep -q '/quarterly"'; then
              m="$(date -u +%m)"; branch="$(date -u +%Y)Q$(( (${m#0} + 2) / 3 ))"
            else
              branch=main
            fi
            echo "ports branch: $branch"
            git clone --depth 1 -b "$branch" https://git.FreeBSD.org/ports.git /usr/ports
            cp -R rendered/freebsd/audio/gridline /usr/ports/audio/gridline
            git -C /usr/ports add audio/gridline  # (portlint -C wants the port's files in git)
            mkdir -p /usr/ports/distfiles && cp dist/Gridline-*-source.tar.gz /usr/ports/distfiles/
            cd /usr/ports/audio/gridline
            portlint -AC
            # Resolve the dependencies with the options the binary packages are built with:
            # some ports default differently outside the package builders (libdvdread, under
            # FFmpeg's DVD option, then wants libdvdcss, which has no binary package).
            env PACKAGE_BUILDING=yes make BATCH=yes install-missing-packages
            make BATCH=yes stage
            make BATCH=yes check-plist
            make BATCH=yes package
            ls -l work/pkg

  snap:
    name: Snap
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p snap && cp packaging/snap/snapcraft.yaml snap/
      - name: LXD and Snapcraft (a few tries, as the snap store is now and then unreachable from a runner)
        run: |
          for n in 1 2 3 4; do
            sudo snap install lxd && sudo snap install --classic snapcraft && break
            [ "$n" = 4 ] && exit 1
            echo "the snap store did not answer; trying again in $((n * 30)) s"; sleep $((n * 30))
          done
      - uses: snapcore/action-build@v1
        id: snap
      - name: The snap installs and runs
        run: |
          sudo snap install --dangerous "${{ steps.snap.outputs.snap }}"
          eval "$(bash tools/release/version.sh)"
          test "$(gridline.cli --version)" = "Gridline $full"
      - uses: actions/upload-artifact@v4
        with:
          name: gridline-snap
          path: ${{ steps.snap.outputs.snap }}

  windows:
    name: Windows package managers
    needs: lint
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: python packaging/render.py --out rendered --fake-sums
      - name: Chocolatey package builds
        run: |
          Push-Location rendered/chocolatey/gridline
          choco pack gridline.nuspec --outputdirectory ..
          Pop-Location
          Get-ChildItem rendered/chocolatey/*.nupkg
      - name: Package manager manifests validate (when the client is installed)
        run: |
          $v = (Get-ChildItem rendered/winget/manifests/g/Gridline/Gridline | Select-Object -First 1).FullName
          $client = Get-Command ("win" + "get") -ErrorAction SilentlyContinue
          if ($client) { & $client.Source validate --manifest $v } else { Write-Output "client not on this runner: the schema check in the lint job covers the manifests" }

  # K-308: the plugin downloads (Gridline Suite and Suite Mini) built exactly as release.yml builds
  # them (tools/release/suite-release.py stage, build, check), as workflow artifacts only: the .pkg
  # and all-plugins zip on macOS, the Windows setups (installed silently for this user and removed)
  # and zip, the Linux .run files (one installed into a scratch folder) and zip. The BSD files need
  # the release's BSD virtual machines; their layout is covered by the tools' self-tests.
  plugins-macos:
    name: Plugin downloads (macOS)
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: brew install --quiet ninja || true
      - name: Build the suites (arm64 + x86_64)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRIDLINE_BUNDLED_SDL2=ON -DGRIDLINE_DEV_ASSETS=OFF \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DGRIDLINE_GUI_TESTS=OFF
          cmake --build build -j4 --target gridline gridline_suite_gridline gridline_suite_mini
      - name: Installers and all-plugins zips
        run: |
          eval "$(bash tools/release/version.sh)"
          python3 tools/release/suite-release.py stage build suite-in --cli build/gridline
          python3 tools/release/suite-release.py build --family macos --version "$full" --input suite-in --out suite-dist --license LICENSE --sign
          python3 tools/release/suite-release.py check --family macos --version "$full" --dir suite-dist --catalogues suite-in
      - uses: actions/upload-artifact@v4
        with:
          name: suite-test-macos
          path: suite-dist/Gridline-Suite-*
          retention-days: 7

  plugins-windows-build:
    name: Plugin downloads (Windows ${{ matrix.arch }} build)
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, msvc: amd64 }
          - { arch: arm64, msvc: amd64_arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Build the suites
        run: |
          extra=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then extra="-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGRIDLINE_BUNDLED_SDL2=ON \
            -DGRIDLINE_DEV_ASSETS=OFF -DGRIDLINE_GUI_TESTS=OFF $extra
          cmake --build build -j4 --target gridline gridline_suite_gridline gridline_suite_mini
      - name: Suite bundles
        run: |
          cli=()
          if [ "${{ matrix.arch }}" = "x64" ]; then cli=(--cli build/gridline.exe); fi
          python tools/release/suite-release.py stage build suite-in "${cli[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: suite-test-bundles-windows-${{ matrix.arch }}
          path: suite-in
          retention-days: 1

  plugins-windows:
    name: Plugin downloads (Windows)
    needs: plugins-windows-build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: suite-test-bundles-windows-x64
          path: suite-in/x64
      - uses: actions/download-artifact@v4
        with:
          name: suite-test-bundles-windows-arm64
          path: suite-in/arm64
      - name: Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --no-progress -y | Select-Object -Last 2 | Write-Host
          $iscc = Get-ChildItem -Path @(${env:ProgramFiles(x86)}, $env:ProgramFiles) -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "ISCC.exe") } | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "Inno Setup not found" }
          "ISCC=$(Join-Path $iscc 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Setups and all-plugins zips
        run: |
          eval "$(bash tools/release/version.sh)"
          python tools/release/suite-release.py build --family windows --version "$full" --input x64=suite-in/x64 --input arm64=suite-in/arm64 \
            --out suite-dist --license LICENSE --iscc "$ISCC"
          python tools/release/suite-release.py check --family windows --version "$full" --dir suite-dist --catalogues suite-in/x64 --install
      - uses: actions/upload-artifact@v4
        with:
          name: suite-test-windows
          path: suite-dist/Gridline-Suite-*
          retention-days: 7

  plugins-linux-build:
    name: Plugin downloads (Linux ${{ matrix.arch }} build)
    needs: lint
    if: needs.lint.outputs.builds == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-22.04 }
          - { arch: aarch64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - run: sudo sh tools/ci/install-deps.sh apt
      - name: Build the suites
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRIDLINE_DEV_ASSETS=OFF -DGRIDLINE_GUI_TESTS=OFF
          cmake --build build -j4 --target gridline gridline_suite_gridline gridline_suite_mini
          python3 tools/release/suite-release.py stage build suite-in --cli build/gridline --tar "suite-bundles-linux-${{ matrix.arch }}.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: suite-test-bundles-linux-${{ matrix.arch }}
          path: suite-bundles-linux-${{ matrix.arch }}.tar
          retention-days: 1

  plugins-linux:
    name: Plugin downloads (Linux)
    needs: plugins-linux-build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-test-bundles-linux-*
          path: suite-tars
          merge-multiple: true
      - name: Installers and all-plugins zips
        run: |
          eval "$(bash tools/release/version.sh)"
          for a in x86_64 aarch64; do mkdir -p "suite-in/$a" && tar -C "suite-in/$a" -xf "suite-tars/suite-bundles-linux-$a.tar"; done
          python3 tools/release/suite-release.py build --family linux --version "$full" --input x86_64=suite-in/x86_64 --input aarch64=suite-in/aarch64 \
            --out suite-dist --license LICENSE
          python3 tools/release/suite-release.py check --family linux --version "$full" --dir suite-dist --catalogues suite-in/x86_64 --install
      - uses: actions/upload-artifact@v4
        with:
          name: suite-test-linux
          path: suite-dist/Gridline-Suite-*
          retention-days: 7
